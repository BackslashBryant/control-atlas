name: GitHub Pages

on:
  workflow_run:
    workflows: [Public Repo Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scope:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - name: Download verified change scope
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-change-scope
          path: .ci
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Decide whether runtime deployment is required
        id: scope
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scope="$(tr -d '\r\n' < .ci/ci-change-scope.txt)"
          case "$scope" in
            evidence-only) echo "deploy=false" >> "$GITHUB_OUTPUT" ;;
            full) echo "deploy=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unrecognized verified change scope: $scope"; exit 1 ;;
          esac

  deploy:
    needs: scope
    if: >-
      ${{ needs.scope.outputs.deploy == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the exact site artifact already verified by CI
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          name: site-build
          path: dist/site
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      # Manual dispatch is an explicit disaster-recovery path. Routine releases
      # always consume CI's exact-SHA artifact and never rebuild.
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v6
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies for manual recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm ci
      - name: Build main for manual recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONTROL_ATLAS_COMMIT_SHA: ${{ github.sha }}
        run: npm run build:site

      - name: Verify artifact provenance
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          actual_sha="$(jq -r '.commit_sha // empty' dist/site/release.json)"
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Site artifact SHA mismatch: expected $EXPECTED_SHA, found ${actual_sha:-missing}"
            exit 1
          fi
          echo "Deploying verified site artifact for $EXPECTED_SHA"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/site'
      - id: deployment
        uses: actions/deploy-pages@v5
