name: GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Runtime checks
        run: npm run test:browser && npm run smoke:dom
      - name: Public verification
        run: npm run verify:public
      - name: Stage static site artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R app _site/app
          cp -R styles _site/styles
          cp -R scripts _site/scripts
          cp -R data _site/data
          cp -R maps _site/maps
          cp -R lib _site/lib
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
