name: Lighthouse A/B

# Diagnostic utility: builds two git refs on the SAME runner, serves each
# locally, and measures both with mobile Lighthouse. Isolates a genuine code
# regression from a hardware-dependent score, which a single measurement on
# unfamiliar hardware cannot do. Report-only — never writes to the repository.
# Trigger: manual dispatch, or push a branch named evidence/lighthouse-ab*.

on:
  workflow_dispatch:
    inputs:
      before_ref:
        description: Baseline git ref
        required: false
        default: "v1.0.0"
      after_ref:
        description: Candidate git ref (defaults to the workflow commit)
        required: false
        default: ""
  push:
    branches:
      - "evidence/lighthouse-ab*"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      BEFORE_REF: ${{ github.event.inputs.before_ref || 'v1.0.0' }}
      AFTER_REF: ${{ github.event.inputs.after_ref || github.sha }}
      MAX_MEDIAN_DROP: "3"
      ROUTE: "/#/explore?node=nist-800-53%3AAC-2&relationshipView=map"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Measure both refs on identical hardware
        run: |
          set -euo pipefail
          mkdir -p artifacts/lighthouse-ab
          measure () {
            local label="$1" ref="$2"
            echo "::group::$label ($ref)"
            git checkout --force "$ref"
            npm ci
            npm run build:site
            PORT=4317 npm run serve:static &
            local server_pid=$!
            for _ in $(seq 1 60); do
              curl -sf http://localhost:4317/ >/dev/null && break || sleep 2
            done
            for i in 1 2 3; do
              local report="artifacts/lighthouse-ab/$label-$i.json"
              if ! npx lighthouse "http://localhost:4317${ROUTE}" \
                  --verbose \
                  --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                  --form-factor=mobile \
                  --screenEmulation.mobile \
                  --only-categories=performance \
                  --max-wait-for-load=90000 \
                  --output=json \
                  --output-path="$report" \
                  2>&1 | tee "artifacts/lighthouse-ab/$label-$i.log"; then
                REPORT="$report" node -e "
                  const report = require('./' + process.env.REPORT);
                  if (typeof report.categories?.performance?.score !== 'number') {
                    process.exit(1);
                  }
                "
                echo "::warning::Lighthouse exited after writing a valid scored report; preserving the report for the comparative gate."
              fi
            done
            kill "$server_pid" 2>/dev/null || true
            echo "::endgroup::"
          }
          measure before "$BEFORE_REF"
          measure after "$AFTER_REF"

      - name: Summarize
        run: |
          node -e "
            const read = (label, i) =>
              require('./artifacts/lighthouse-ab/' + label + '-' + i + '.json');
            const summarize = (label) =>
              [1, 2, 3].map((i) => {
                const r = read(label, i);
                return {
                  ref: label,
                  run: i,
                  performance: Math.round(r.categories.performance.score * 100),
                  lcp: r.audits['largest-contentful-paint'].displayValue,
                  tbt: r.audits['total-blocking-time'].displayValue,
                  cls: r.audits['cumulative-layout-shift'].displayValue,
                };
              });
            const before = summarize('before');
            const after = summarize('after');
            console.table([...before, ...after]);
            const median = (rows) => [...rows.map((r) => r.performance)].sort((a, b) => a - b)[1];
            const beforeMedian = median(before);
            const afterMedian = median(after);
            const allowedMinimum = beforeMedian - Number(process.env.MAX_MEDIAN_DROP);
            console.log('BEFORE(' + process.env.BEFORE_REF + ') median: ' + beforeMedian);
            console.log('AFTER (' + process.env.AFTER_REF + ') median: ' + afterMedian);
            const shifts = read('after', 3).audits['layout-shifts'];
            for (const item of (shifts?.details?.items || []).slice(0, 5)) {
              const sel = item.subItems?.items?.[0]?.node?.selector || item.node?.selector || '';
              console.log('after shift', (item.score ?? 0).toFixed(3), sel.slice(0, 80));
            }
            require('fs').writeFileSync(
              'artifacts/lighthouse-ab/summary.json',
              JSON.stringify({ before, after, beforeMedian, afterMedian, allowedMinimum }, null, 2),
            );
            if (afterMedian < allowedMinimum) {
              console.error('Performance regression: candidate median ' + afterMedian + ' is below allowed minimum ' + allowedMinimum + '.');
              process.exit(1);
            }
          "

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-ab
          path: artifacts/lighthouse-ab
          if-no-files-found: warn
