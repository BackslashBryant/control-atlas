name: Weekly Data Refresh

on:
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Dependency audit
        run: npm run audit:deps
      - name: Refresh validated build-time data
        run: npm run refresh:data
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Run full repository gate
        env:
          PLAYWRIGHT_WORKERS: '2'
        # refresh:data already rebuilt and validated generated graph artifacts;
        # reuse them instead of running the same graph build a second time.
        run: npm run precommit:incremental
      - name: Generate review SBOM
        run: npm run sbom:generate
      - uses: actions/upload-artifact@v7
        with:
          name: source-refresh-sbom-cdx-json
          path: artifacts/sbom.cdx.json
      - name: Summarize source changes
        run: node scripts/report-refresh-diff.mjs refresh-pr-body.md
      - name: Create or update the human-review PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            data/**
            maps/**
          branch: automation/source-refresh
          commit-message: 'chore(data): refresh public source snapshots'
          title: 'chore(data): review refreshed public source snapshots'
          body-path: refresh-pr-body.md
          draft: always-true
          delete-branch: true
          labels: data-refresh
