name: Nightly Data Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Dependency audit
        run: npm run audit:deps
      - name: Refresh data artifacts
        run: npm run refresh:data
      - name: Build staged static site
        run: npm run build:site
      - name: License check
        run: npm run license:check
      - name: Runtime checks
        run: npm run test:browser && npm run smoke:dom
      - name: Public verification
        run: npm run verify:public
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Accessibility verification
        run: npm run test:a11y
      - name: Generate SBOM
        run: npm run sbom:generate
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-sbom-cdx-json
          path: artifacts/sbom.cdx.json
      - name: Commit data changes
        run: |
          if git diff --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data maps
          git commit -m "chore(data): nightly refresh [skip ci]"
          git push
