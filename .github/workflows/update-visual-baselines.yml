name: Update Visual Baselines

# Maintenance utility: regenerates the approved-layout visual baselines inside
# the hosted Ubuntu runner CI uses, and publishes them as an artifact for human
# review. Never writes to the repository and does not require Docker.
# Trigger: push a branch named refresh/visual-baselines* (or dispatch manually).

on:
  workflow_dispatch:
  push:
    branches:
      - "refresh/visual-baselines*"

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      # Playwright exits non-zero whenever --update-snapshots rewrites a
      # baseline, which is the entire point of this job. continue-on-error
      # keeps the run going to the upload step while still showing the step
      # as failed, so a genuine failure is visible rather than swallowed.
      - name: Regenerate baselines
        continue-on-error: true
        run: npx playwright test --config playwright.visual.config.mjs --update-snapshots
      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v7
        with:
          name: approved-layout-visual-baselines
          path: tests/e2e/approved-layout-visual.spec.mjs-snapshots
          if-no-files-found: error
