name: CodeQL

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/audits/**'
      - 'artifacts/audits/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/audits/**'
      - 'artifacts/audits/**'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: github/codeql-action/analyze@v4
