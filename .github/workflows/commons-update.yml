name: Control Commons Automated Health & Index Build

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-commons-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Commons Index & Schema
        run: node scripts/build-commons-index.mjs

      - name: Check Link Health & Metadata
        run: node scripts/check-commons-health.mjs

      - name: Audit Search Quality Benchmark
        run: npm test
