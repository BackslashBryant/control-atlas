name: Pages Live Smoke

on:
  workflow_run:
    workflows: [GitHub Pages]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Check whether Pages actually deployed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conclusion="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name == "deploy") | .conclusion'
          )"
          if [[ "$conclusion" == "success" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  live-smoke:
    needs: gate
    if: >-
      ${{ needs.gate.outputs.run == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run bounded live smoke and exact-SHA proof
        run: npm run test:e2e:live
        env:
          PLAYWRIGHT_BASE_URL: https://rambulls.github.io/control-atlas/
          EXPECTED_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
