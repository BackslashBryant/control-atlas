name: Public Repo Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Dependency audit
        run: npm run audit:deps
      - name: Build staged static site
        run: npm run build:site
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and contract verification
        run: npm test && npm run test:browser && npm run smoke:dom && npm run verify:public
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Accessibility smoke
        run: npm run test:a11y:smoke
      - name: Critical browser smoke
        run: npm run test:e2e:smoke
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
  approved-layout-visuals:
    # Snapshot comparison is a diagnosis tool, not a deploy gate. Run it on demand.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build:site
      - run: npm run test:visual
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: approved-layout-visual-diffs
          path: test-results
          if-no-files-found: ignore

  lighthouse-report:
    # Lighthouse is useful for investigation, but noisy as a deploy requirement.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run report-only Lighthouse evidence
        continue-on-error: true
        run: npm run test:performance
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-reports
          path: artifacts/lighthouse-ci
          if-no-files-found: warn
