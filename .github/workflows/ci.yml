name: Public Repo Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Dependency audit
        run: npm run audit:deps
      - name: Build staged static site
        run: npm run build:site
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: License check
        run: npm run license:check
      - name: Unit and contract verification
        run: npm test && npm run test:browser && npm run smoke:dom && npm run verify:public
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: End-to-end verification
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
      - name: Generate SBOM
        run: npm run sbom:generate
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cdx-json
          path: artifacts/sbom.cdx.json
