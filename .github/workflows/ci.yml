name: Public Repo Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Dependency audit
        run: npm run audit:deps
      - name: Build staged static site
        run: npm run build:site
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: License check
        run: npm run license:check
      - name: Copy terminology and repetition checks
        run: npm run test:style && npm run style:check
      - name: Unit and contract verification
        run: npm test && npm run test:browser && npm run smoke:dom && npm run verify:public
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Accessibility verification
        run: npm run test:a11y:run
      - name: End-to-end verification
        run: npm run test:e2e:run
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
      - name: Generate SBOM
        run: npm run sbom:generate
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cdx-json
          path: artifacts/sbom.cdx.json

  approved-layout-visuals:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build:site
      - run: npm run test:visual
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: approved-layout-visual-diffs
          path: test-results
          if-no-files-found: ignore

  lighthouse-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run report-only Lighthouse evidence
        continue-on-error: true
        run: npm run test:performance
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-reports
          path: artifacts/lighthouse-ci
          if-no-files-found: warn
