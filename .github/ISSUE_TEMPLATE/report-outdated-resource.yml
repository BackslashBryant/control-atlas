name: Report Outdated Resource
description: Notify the Control Commons maintainers about a superseded, updated, or deprecated resource.
title: "[Outdated Resource]: "
labels: ["commons", "outdated-resource"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep Control Commons fresh and accurate for government cybersecurity practitioners.
  - type: input
    id: resource_id
    attributes:
      label: Resource ID or Name
      description: Enter the Control Commons Resource ID (e.g., `official-nist-sp800-53-r5`) or exact title.
      placeholder: e.g. official-nist-sp800-53-r5
    validations:
      required: true
  - type: input
    id: current_url
    attributes:
      label: Current Canonical URL
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: update_type
    attributes:
      label: Update Type
      options:
        - "New Version Released"
        - "Publication Superseded"
        - "URL Moved / Redirected"
        - "Repository Archived"
        - "Official Status Changed"
    validations:
      required: true
  - type: input
    id: replacement_url
    attributes:
      label: New / Replacement URL (if available)
      placeholder: https://...
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Additional Context / Release Notes
      description: Provide any version numbers, release dates, or publisher announcements.
    validations:
      required: true
